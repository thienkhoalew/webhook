name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres-api:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhook_api_user
          POSTGRES_PASSWORD: webhook_api_password
          POSTGRES_DB: webhook_api_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook_api_user -d webhook_api_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres-delivery:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhook_delivery_user
          POSTGRES_PASSWORD: webhook_delivery_password
          POSTGRES_DB: webhook_delivery_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U webhook_delivery_user -d webhook_delivery_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      API_DB_HOST: localhost
      API_DB_PORT: 5432
      API_DB_USERNAME: webhook_api_user
      API_DB_PASSWORD: webhook_api_password
      API_DB_DATABASE: webhook_api_db
      DELIVERY_DB_HOST: localhost
      DELIVERY_DB_PORT: 5433
      DELIVERY_DB_USERNAME: webhook_delivery_user
      DELIVERY_DB_PASSWORD: webhook_delivery_password
      DELIVERY_DB_DATABASE: webhook_delivery_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token
      JWT_SECRET: ci-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run migration:run
      - run: npm run test:e2e -- --runInBand
      - run: docker compose config --quiet
